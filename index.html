<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Čejkovice B · Balcony bench</title>
<style>
  :root { --ink: #2b2622; --muted: #7a7065; --paper: #f2ede4; --accent: #b85c2a; --chip: rgba(255,255,255,.84); }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font-family: "Roboto", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; touch-action: none; }
  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: 16px; pointer-events: none; }
  header h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
  header p { margin: 4px 0 0; font-size: 12px; font-weight: 300; letter-spacing: .06em; color: var(--muted); }
  #caption { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 48px); left: max(16px, env(safe-area-inset-left)); max-width: 360px;
    margin-right: 16px; font-size: 12px; font-weight: 300; line-height: 1.45; pointer-events: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 0 max(16px, env(safe-area-inset-left)); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; box-shadow: 0 1px 6px rgba(0,0,0,.08); backdrop-filter: blur(6px); }
  .seg button, .btn { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    padding: 9px 14px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; }
  .btn { background: var(--accent); color: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  .btn[hidden] { display: none !important; }
  #note { position: fixed; left: 0; right: 0; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 52px); text-align: center; font-size: 12px; color: var(--muted);
    padding: 0 16px; pointer-events: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
  model-viewer.ar { position: fixed; width: 1px; height: 1px; left: -10px; bottom: 0; opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<header>
  <h1>Čejkovice B · Balcony bench</h1>
  <p>Balcony in the north roof · two versions of the larch bench</p>
</header>
<div id="caption"></div>
<div id="load">Loading the model…</div>
<div id="note">Drag to turn · pinch or scroll to zoom</div>
<div id="bar">
  <div class="seg" id="variant">
    <button data-v="A" class="on">A · vertical ribs</button>
    <button data-v="B">B · horizontal layers</button>
  </div>
  <button class="btn" id="arbtn" hidden>View in your space</button>
</div>
<!-- AR on the phone (Android: Scene Viewer / WebXR, iPhone / iPad: Quick Look); full size 1:1, pinch to scale -->
<model-viewer class="ar" id="mvA" loading="lazy" src="models/balcony_A.glb" ios-src="models/balcony_A.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" alt="Balcony bench, version A"></model-viewer>
<model-viewer class="ar" id="mvB" loading="lazy" src="models/balcony_B.glb" ios-src="models/balcony_B.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" alt="Balcony bench, version B"></model-viewer>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const TEXT = {
  A: "Version A · larch ribs 40 × 30 mm at 50 mm with open 10 mm gaps, square to the line of the bench; the ribs turn with the bench at both ends.",
  B: "Version B · horizontal larch layers 40 mm on the same shape; the seat is one board with a rounded nose, open 6 mm joints follow the curved surface."
};
const caption = document.getElementById("caption");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2ede4);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 200);
camera.position.set(-6.5, 5.5, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0); controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.495;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7d70, 0.55));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.0);
sun.position.set(-8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 50 }); sun.shadow.bias = -0.0004;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.003; ground.receiveShadow = true; scene.add(ground);

const parts = { context: null, A: null, B: null };
let variant = "A";
const draco = new DRACOLoader().setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
const loader = new GLTFLoader().setDRACOLoader(draco);
function prep(g) { g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return g; }
function load(name) { return new Promise((res, rej) => loader.load(`models/${name}.glb`, g => res(prep(g.scene)), undefined, rej)); }
function show(v) {
  variant = v;
  if (parts.A) parts.A.visible = v === "A";
  if (parts.B) parts.B.visible = v === "B";
  document.querySelectorAll("#variant button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  caption.textContent = TEXT[v];
  updateAR();
}
Promise.all([load("context"), load("bench_A")]).then(([c, a]) => {
  parts.context = c; parts.A = a; scene.add(c, a);
  document.getElementById("load").remove(); show(variant);
  load("bench_B").then(b => { parts.B = b; b.visible = variant === "B"; scene.add(b); });
}).catch(e => { document.getElementById("load").textContent = "The model could not be loaded"; console.error(e); });
document.querySelectorAll("#variant button").forEach(b => b.addEventListener("click", () => show(b.dataset.v)));

// AR through <model-viewer> (it picks WebXR, Scene Viewer or Quick Look for the device)
const arbtn = document.getElementById("arbtn");
function mv() { return document.getElementById("mv" + variant); }
function updateAR() { const m = mv(); arbtn.hidden = !(m && m.canActivateAR); }
customElements.whenDefined("model-viewer").then(() => {
  for (const id of ["mvA", "mvB"]) document.getElementById(id).addEventListener("load", updateAR);
  setTimeout(updateAR, 1500);
});
arbtn.addEventListener("click", () => mv().activateAR());

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
